# CI：每次 push / PR 自动跑测试 + 验证 Docker 镜像可构建。
# 为什么只装轻量依赖：测试面向轻量模式（零依赖设计），
# 不装 sentence-transformers/torch，CI 从十几分钟降到一分钟级。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest fastapi uvicorn httpx numpy

      - name: Run tests
        run: pytest tests/ -v

  docker:
    # 为什么单独一个 job：保证镜像在任何时候都能构建成功，
    # 避免"代码能跑但 Dockerfile 悄悄烂了"没人发现
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t rag_project:ci .
